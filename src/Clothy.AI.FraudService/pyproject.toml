# Tool configuration. Tests are configured in pytest.ini.

[tool.ruff]
line-length = 120
target-version = "py310"
# The linter checks only the service code and new tests; research scripts and early tests are excluded.
include = ["src/**/*.py", "tests/test_api_docs.py", "tests/test_config.py", "tests/test_decisions.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
